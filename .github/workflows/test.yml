name: CI — Security Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-test:
    name: Security & API Tests
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server
        run: |
          # Start the server fully detached with output redirected to files.
          # A child that inherits the step's stdout/stderr pipes is killed
          # when the step ends and the pipes close (Windows runner behavior)
          # — file redirection avoids that. /token is probed because it is
          # the only auth-free endpoint (API paths require the token).
          Start-Process -FilePath python -ArgumentList "server.py" `
            -RedirectStandardOutput server-ci.log -RedirectStandardError server-ci.err.log `
            -WindowStyle Hidden
          $timeout = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8745/token" -TimeoutSec 2 -ErrorAction Stop
              if ($response.StatusCode -eq 200) { break }
            } catch { }
            Start-Sleep -Seconds 1
            $elapsed++
          }
          if ($elapsed -ge $timeout) {
            if (Test-Path server-ci.err.log) { Get-Content server-ci.err.log | Write-Host }
            Write-Error "Server failed to start within ${timeout}s"
            exit 1
          }
          Write-Host "Server is ready"

      - name: Run security tests
        run: python test-security.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Stop server
        if: always()
        run: |
          $procs = Get-NetTCPConnection -LocalPort 8745 -ErrorAction SilentlyContinue |
                   Select-Object -ExpandProperty OwningProcess -Unique
          foreach ($pid in $procs) {
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }
